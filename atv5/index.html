<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            background-color: #1d355a;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 10px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        footer {
            background-color: #191c1f;
            color: white;
            text-align: center;
            padding: 10px;
        }

        form {
            background-color: white;
            width: 90%;
            max-width: 450px;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .campos {
            display: block;
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .radio {
            margin-top: 15px;
        }

        .radio input[type="radio"] {
            margin-right: 4px;
            vertical-align: middle;
        }

        .radio label {
            display: inline-block;
            margin-top: 0;
            margin-right: 15px;
            vertical-align: middle;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .file_button::file-selector-button {
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #eee;
            padding: 4px 8px;
            cursor: pointer;
        }

        .file_button::file-selector-button:hover {
            background: #330c9e;
            color: white;
        }

    </style>
</head>

<body>
    <header>
        <h1>Formulário</h1>
    </header>
    <main>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="usuarioNome" class="campos" placeholder="Digite aqui seu Nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="usuarioEmail" class="campos" placeholder="Digite aqui seu Email">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="usuarioSenha" class="campos" placeholder="Digite aqui sua Senha">

            <label for="data_nasc">Data de Nascimento</label>
            <input type="date" id="data_nasc" name="usuarioData" class="campos">

            <label for="curso">Curso</label>
            <input type="text" id="curso" name="usuarioCurso" class="campos" placeholder="Digite aqui seu Curso">

            <div class="radio">
                <input type="radio" id="masc" name="usuarioSexo">
                <label for="masc">Masculino</label>

                <input type="radio" id="fem" name="usuarioSexo">
                <label for="fem">Feminino</label>

                <input type="radio" id="outro" name="usuarioSexo">
                <label for="outro">Outro</label>
            </div>

            <label for="inte">Interesses</label>
            <input type="text" id="inte" name="usuarioInteresses" class="campos" placeholder="Digite aqui seus Interesses">

            <label for="coment">Comentários</label>
            <textarea id="coment" name="usuarioComentario" rows="5" class="campos" placeholder="Faça um comentario..."></textarea>

            <label for="up_foto">Upload de Foto</label>
            <input type="file" id="up_foto" name="usuarioFoto" class="file_button">
        </form>
    </main>
    <footer>
        <p><b>Feito por: Gregório Celso C. Lotz</b></p>
        <p><i>2026</i></p>
    </footer>
</body>

</html>
